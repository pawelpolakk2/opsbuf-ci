
  # __HOST__ on the LAN, a single-page app served from __ROOT__; its certificate comes from a local CA (LAN names only)
  server {
    listen 443 ssl;
    server_name __HOST__;
    access_log /Users/macmini/Apps/logs/__HOST__.access.log main;

    ssl_certificate /Users/macmini/Apps/nginx/tls/__HOST__/cert.pem;
    ssl_certificate_key /Users/macmini/Apps/nginx/tls/__HOST__/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root __ROOT__;
    allow 127.0.0.0/8;
    allow 192.168.88.0/24;
    deny all;

    # every route of the app loads index.html; it is never cached, so a release shows on the next load
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }

    # the build names these files by their content, so they never change
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }
  }
