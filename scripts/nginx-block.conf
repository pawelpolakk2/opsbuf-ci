
  # the opsbuf CI on the LAN (pl.opsbuf.ci); its certificate comes from the local CA (LAN names only)
  server {
    listen 443 ssl;
    server_name opsbuf-ci.local;
    access_log /Users/macmini/Apps/logs/opsbuf-ci.access.log main;

    ssl_certificate /Users/macmini/Apps/nginx/tls/opsbuf-ci.local/cert.pem;
    ssl_certificate_key /Users/macmini/Apps/nginx/tls/opsbuf-ci.local/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://127.0.0.1:7460;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # the page reads live logs
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300;
      allow 127.0.0.0/8;
      allow 192.168.88.0/24;
      deny all;
    }
  }
